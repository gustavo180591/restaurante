version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@db:5474/restaurante?schema=public
    depends_on:
      - db
    command: sh -c "npm install && npm run dev"

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurante
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5474:5432"

volumes:
  postgres_data:
