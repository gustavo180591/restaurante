version: '3.8'

services:
  web:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/restaurante?schema=public
      - SESSION_COOKIE_NAME=__sid
      - SESSION_COOKIE_SECURE=false
      - SESSION_TTL_DAYS=7
      - BCRYPT_ROUNDS=12
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "npm install && npx prisma migrate dev && npm run dev"