version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: restaurante_staging_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    ports:
      - "5433:5432"  # Puerto diferente para staging
    volumes:
      - db_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante_staging_web
    environment:
      NODE_ENV: staging
      DATABASE_URL: postgresql://app:app@db:5432/appdb?schema=public
      PORT: 3001
      STORAGE_DRIVER: disk
      DISK_UPLOAD_DIR: /app/storage/uploads
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - app_staging_uploads:/app/storage/uploads
    restart: unless-stopped

volumes:
  db_staging_data:
  app_staging_uploads:
